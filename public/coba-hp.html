<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Coba Tampilan HP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Prototipe tampilan HP: 5 gaya (D, F, G, H, I) memakai data & menu yang sama; terang bawaan, gelap lewat tombol. */
:root {
  --bg: #f3efea; --bg-2: #f2f0ed; --surface: #ffffff; --surface-2: #f8f6f2; --line: #e7e1d9; --line-2: #efebe6;
  --ink: #2b2723; --ink-2: #6b635b; --ink-3: #968d84;
  --accent: #2563eb; --accent-2: #1d4ed8; --accent-soft: #eaf1fe; --accent-edge: #bcd0fb;
  --chrome: #211e1b; --chrome-2: #2e2a26; --chrome-ink: #efe9e2; --chrome-ink-2: #a39a91;
  --btn: #26221f; --seg: #e6e2dd; --overlay: rgba(38, 34, 31, .45);
  --amber: #d97706; --blue: #2563eb; --red: #dc2626; --green: #059669; --violet: #7c3aed; --teal: #0d9488; --pink: #db2777; --sky: #0284c7; --gray: #7a726a;
  --foto-a: #d8cfc6; --foto-b: #c9a59b; --foto-c: #eee8e1;
  --shadow: 0 1px 2px rgba(74, 52, 30, .05), 0 10px 26px -16px rgba(74, 52, 30, .3);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #12100f; --bg-2: #12100f; --surface: #1f1c19; --surface-2: #252220; --line: #36302b; --line-2: #2c2825;
  --ink: #efe9e2; --ink-2: #b9afa5; --ink-3: #8a8077; --accent-soft: #1f2a44; --accent-edge: #2d4fa0;
  --chrome: #0f0d0c; --chrome-2: #1f1c19; --btn: #2563eb; --seg: #2c2825; --overlay: rgba(0, 0, 0, .6);
  --foto-a: #2a2420; --foto-b: #3a2a26; --foto-c: #1c1917;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .8); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: inherit; }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.g { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.w-amber { --c: var(--amber); } .w-blue { --c: var(--blue); } .w-red { --c: var(--red); } .w-green { --c: var(--green); } .w-violet { --c: var(--violet); }
.w-teal { --c: var(--teal); } .w-pink { --c: var(--pink); } .w-sky { --c: var(--sky); } .w-gray { --c: var(--gray); }

/* Bilah pilih gaya */
.pilih { flex-shrink: 0; background: var(--btn); color: #fff; display: flex; align-items: center; gap: 8px; padding-block: 7px; }
.gulir-gaya { flex: 1; min-width: 0; display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.gulir-gaya::-webkit-scrollbar { display: none; }
.pilih button { flex-shrink: 0; padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.12); white-space: nowrap; }
.pilih button[aria-pressed="true"] { background: #fff; color: #26221f; }
.pilih .tema { width: 34px; height: 30px; border-radius: 10px; flex-shrink: 0; padding: 0; display: flex; align-items: center; justify-content: center; }

.app { flex: 1; min-height: 0; width: 100%; max-width: 440px; margin: 0 auto; position: relative; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
@media (min-width: 480px) { .app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
#kepala, #nav { flex-shrink: 0; position: relative; z-index: 2; }
#scr { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; z-index: 1; }
.isi { padding-bottom: 24px; }

/* Komponen bersama */
.kartu { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 16px; }
.kecil { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.sub { font-size: 12.5px; color: var(--ink-2); }
.angka { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.lencana { position: absolute; top: -6px; right: -9px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid var(--surface); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; background: linear-gradient(135deg, #fde68a, #f59e0b); color: #78350f; flex-shrink: 0; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(140deg, #22d3ee, var(--accent)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo svg { width: 14px; height: 14px; fill: #fff; stroke: none; }
.ikonbtn { position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); flex-shrink: 0; }
.pil { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, var(--c) 15%, var(--surface)); color: var(--c); }
.tile { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.bilah { height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.bilah i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--accent)); }
.progres { display: flex; align-items: center; gap: 10px; width: 100%; }
.progres .bilah { flex: 1; display: block; }
.progres b { font-size: 12px; font-weight: 800; color: var(--ink-2); min-width: 34px; text-align: right; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-3); }
.meta > span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.meta .i { width: 13px; height: 13px; stroke-width: 2; opacity: .85; }
.kosong { text-align: center; padding: 34px 10px; color: var(--ink-3); font-size: 13px; }
.catatan { font-size: 11.5px; color: var(--ink-3); text-align: center; margin: 16px 0 0; }
.cari { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; color: var(--ink-3); }
.cari input { flex: 1; min-width: 0; border: 0; background: none; padding: 11px 0; font-size: 14px; outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex-shrink: 0; min-height: 38px; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.chips button em { font-style: normal; font-size: 11px; opacity: .75; }
.chips button[aria-pressed="true"] { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #fff; }
.tumpuk { display: flex; flex-direction: column; gap: 12px; }
.seksi-judul { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 800; margin: 4px 2px -2px; }
.seksi-judul button { font-size: 12.5px; font-weight: 700; color: var(--accent); }

/* Lembar bawah (menu & detail) */
.tirai { position: absolute; inset: 0; background: var(--overlay); z-index: 20; opacity: 0; transition: opacity .2s; }
.lembar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); color: var(--ink); border-radius: 26px 26px 0 0; padding-top: 10px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-height: 86%; overflow-y: auto; }
.lembar.buka { transform: none; } .tirai.buka { opacity: 1; }
.pegangan { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 12px; }
.lembar h3 { margin: 0; font-size: 17px; font-weight: 800; }
.grupnama { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; color: var(--ink-3); margin: 16px 0 10px; }
.grid-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; }
.grid-menu > button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--ink-2); text-align: center; line-height: 1.2; }
.grid-menu .tile { width: 50px; height: 50px; border-radius: 16px; }
.grid-menu .tile .i { width: 22px; height: 22px; }
.detail-baris { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-2); font-size: 13.5px; }
.detail-baris span:first-child { color: var(--ink-3); }
.detail-baris span:last-child { font-weight: 700; text-align: right; }
.tombol { display: block; width: 100%; text-align: center; border-radius: 999px; padding: 12px; font-size: 14px; font-weight: 700; background: var(--btn); color: #fff; }

/* Nav bawah bersama */
.nav { display: flex; background: var(--surface); border-top: 1px solid var(--line); padding: 7px max(4px, env(safe-area-inset-right, 0px)) calc(9px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.nav > button { flex: 1; min-height: 46px; justify-content: center; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--ink-3); position: relative; }
.nav > button[aria-current="page"] { color: var(--accent); font-weight: 800; }
.nav .ik { position: relative; display: flex; }

/* ═════ D: SUPER-APP ═════ */
.d-biru { background: linear-gradient(160deg, var(--accent) 0%, var(--accent-2) 100%); color: #fff; }
.d-home-atas { padding-block: 12px 50px; }
.d-baris { display: flex; align-items: center; gap: 12px; }
.d-baris h1 { margin: 0; flex: 1; font-size: 17px; font-weight: 800; line-height: 1.2; min-width: 0; }
.d-baris h1 small { display: block; font-size: 12px; font-weight: 600; opacity: .82; }
.d-ikon { position: relative; width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.22); color: #fff; flex-shrink: 0; }
.d-ikon .lencana { border-color: var(--accent); }
.d-cari-btn { margin-top: 14px; width: 100%; background: var(--surface); border-radius: 14px; padding: 11px 14px; display: flex; gap: 10px; align-items: center; color: var(--ink-3); font-size: 13px; font-weight: 600; }
.d-grid { margin-top: -36px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 16px 8px 12px; position: relative; }
.d-mod-atas { padding-block: 10px 14px; }
.d-mod-atas .cari { margin-top: 12px; border: 0; }
.d-item { display: flex; gap: 12px; align-items: flex-start; width: 100%; }
.d-item .badan { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.d-item .atas { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.d-item b { font-size: 14px; line-height: 1.3; }

/* ═════ F: MINIMAL DAFTAR ═════ */
.app[data-gaya="f"] { background: var(--bg-2); }
.f-atas { display: flex; align-items: center; gap: 10px; padding-block: 8px; background: var(--bg-2); border-bottom: 1px solid transparent; }
.f-atas .tengah { flex: 1; text-align: center; font-size: 15px; font-weight: 800; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-atas.ciut { border-bottom-color: var(--line); } .f-atas.ciut .tengah { opacity: 1; }
.f-kembali { display: flex; align-items: center; gap: 0; font-size: 15px; font-weight: 600; color: var(--accent); min-width: 38px; }
.f-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); flex-shrink: 0; }
.f-besar h1 { margin: 0; font-size: 31px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
.f-besar p { margin: 4px 0 14px; font-size: 13px; color: var(--ink-2); }
.f-cari { display: flex; align-items: center; gap: 8px; background: var(--seg); border-radius: 11px; padding: 0 12px; color: var(--ink-3); margin-bottom: 12px; }
.f-cari input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 0; font-size: 15px; outline: none; }
.f-grupjudul { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding: 0 14px 7px; }
.f-grup { background: var(--surface); border-radius: 14px; overflow: hidden; margin-bottom: 22px; }
.f-baris { display: flex; align-items: center; gap: 12px; width: 100%; padding-left: 14px; min-height: 52px; }
.f-baris .badan { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 11px 14px 11px 0; border-top: 1px solid var(--line-2); align-self: stretch; }
.f-grup > .f-baris:first-child .badan { border-top: 0; }
.f-baris .teks { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
.f-baris .teks small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-ik { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; background: var(--c); }
.f-ik .i { width: 17px; height: 17px; }
.f-nilai { font-weight: 800; font-size: 15px; }
.panah { width: 16px !important; height: 16px !important; color: var(--ink-3); opacity: .6; }
.app[data-gaya="f"] .nav { background: color-mix(in srgb, var(--surface-2) 92%, transparent); }

/* ═════ G: BINGKAI FOTO ═════ */
.app[data-gaya="g"] { background: var(--foto-c); }
.app[data-gaya="g"]::before { content: ""; position: absolute; inset: 0; z-index: 0; opacity: .9; background:
  linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--foto-c) 70%, transparent) 100%),
  repeating-linear-gradient(90deg, var(--foto-a) 0 34px, var(--foto-b) 34px 46px, var(--foto-a) 46px 80px); }
.g-atas { background: var(--surface); display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.g-atas b { flex: 1; font-size: 15px; font-weight: 800; min-width: 0; }
.g-atas b small { display: block; font-size: 10.5px; font-weight: 700; color: var(--amber); }
.g-panel { margin: 10px 10px 0; background: color-mix(in srgb, var(--surface-2) 76%, transparent); border: 1px solid color-mix(in srgb, var(--surface) 70%, transparent); border-radius: 24px; overflow: hidden; }
.g-kepala { background: var(--surface); border-bottom: 1px solid var(--line); padding: 13px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 3; }
.g-kepala h1 { margin: 0; font-size: 16.5px; font-weight: 800; flex: 1; min-width: 0; }
.g-kepala h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 2px; }
.g-ikonmod { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-2); border: 1px solid var(--accent-edge); flex-shrink: 0; }
.g-isi { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.geser { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -12px; padding: 2px 12px 6px; }
.geser::-webkit-scrollbar { display: none; }
.g-stat { flex: 0 0 128px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 18px; padding: 11px 13px; box-shadow: var(--shadow); }
.g-stat[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 10%, var(--surface)); border-color: var(--c); }
.g-stat b { display: block; font-size: 23px; font-weight: 800; letter-spacing: -.03em; }
.g-stat span { display: block; font-size: 12.5px; font-weight: 700; margin-top: 3px; }
.g-cepat { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.g-cepat button { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; color: var(--ink-2); text-align: center; }
.g-cepat .bulat, .g-nav .bulat { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); position: relative; color: var(--ink-2); }
.donat-baris { display: flex; align-items: center; gap: 14px; margin-top: 10px; }
.legenda { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
.legenda button { display: flex; align-items: center; gap: 7px; }
.legenda i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.legenda span { flex: 1; color: var(--ink-2); }
.g-nav { margin: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); display: flex; justify-content: space-around; padding: 8px 6px; }
.g-nav > button { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: var(--ink-2); }
.g-nav > button[aria-current="page"] { color: var(--accent-2); }
.g-nav > button[aria-current="page"] .bulat { background: linear-gradient(150deg, #60a5fa, var(--accent) 55%, var(--accent-2)); color: #fff; box-shadow: 0 6px 12px -5px rgba(37,99,235,.7); }

/* ═════ H: ARANG PRO ═════ */
.h-atas { background: var(--chrome); color: var(--chrome-ink); padding-block: 12px 0; }
.h-atas .baris { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
.h-atas h1 { margin: 0; flex: 1; font-size: 18px; font-weight: 800; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h-atas h1 small { display: block; font-size: 11.5px; font-weight: 600; color: var(--chrome-ink-2); }
.h-ikon { position: relative; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--chrome-2); color: var(--chrome-ink); flex-shrink: 0; }
.h-ikon .lencana { border-color: var(--chrome); }
.h-tab { display: flex; gap: 18px; overflow-x: auto; scrollbar-width: none; }
.h-tab::-webkit-scrollbar { display: none; }
.h-tab button { flex-shrink: 0; padding: 4px 0 10px; font-size: 13px; font-weight: 700; color: var(--chrome-ink-2); border-bottom: 2.5px solid transparent; display: flex; gap: 6px; align-items: center; }
.h-tab button em { font-style: normal; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: var(--chrome-2); }
.h-tab button[aria-pressed="true"] { color: #fff; border-bottom-color: var(--accent); }
.h-tab button[aria-pressed="true"] em { background: var(--accent); color: #fff; }
.h-cari { display: flex; align-items: center; gap: 8px; background: var(--chrome-2); border-radius: 12px; padding: 0 12px; color: var(--chrome-ink-2); margin-bottom: 12px; }
.h-cari input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 0; font-size: 14px; outline: none; color: var(--chrome-ink); }
.h-kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.h-kpi > button { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.h-kpi .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.h-kpi .lbl i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); }
.h-kpi b { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
.h-daftar { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.h-baris { display: flex; gap: 12px; padding: 12px 14px 12px 0; width: 100%; }
.h-baris + .h-baris { border-top: 1px solid var(--line-2); }
.h-baris .strip { width: 4px; border-radius: 0 4px 4px 0; background: var(--c); flex-shrink: 0; }
.h-baris .badan { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

    const ss = Object.keys(MOD[k].st), jml = MOD[k].data.length;
    let off = 25, isi = '<circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line-2)" stroke-width="6"/>';
    ss.forEach(s => { const p = hitung(k, s) / jml * 100; if (p) isi += `<circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--${stW(k, s)})" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; });
    return `<svg viewBox="0 0 42 42" width="92" height="92" aria-label="Diagram status ${MOD[k].pendek}">${isi}<text x="21" y="23" text-anchor="middle" font-size="9" font-weight="800" fill="var(--ink)" font-family="Plus Jakarta Sans, sans-serif">${jml}</text></svg>`;
  }

  /* ───── Gambar ───── */
  function gambar() {
    const G = GAYA[S.gaya], k = S.layar === 'home' ? null : S.layar;
    $('app').dataset.gaya = S.gaya;
    document.querySelectorAll('.pilih [data-gaya]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.gaya === S.gaya)));
    $('kepala').innerHTML = G.kepala(k);
    $('scr').innerHTML = k ? `<div class="isi"><div id="saring">${G.saring(k)}</div><div id="daftar">${G.daftar(k)}</div>${catatan}</div>` : G.home();
    $('nav').innerHTML = G.nav();
    $('scr').scrollTop = 0;
    pasangPapan();
  }
  function gambarDaftar(ulangSaring) {
    const G = GAYA[S.gaya], k = S.layar;
    if (ulangSaring) {
      if (S.gaya === 'h') $('saring-h').innerHTML = tabH(k);
      else { const f = document.activeElement && document.activeElement.id === 'cari'; $('saring').innerHTML = G.saring(k); if (f) { const c = $('cari'); c.focus(); c.setSelectionRange(c.value.length, c.value.length); } }
    }
    $('daftar').innerHTML = G.daftar(k);
    pasangPapan();
  }
  function pasangPapan() {
    const p = $('papan'); if (!p) return;
    p.addEventListener('scroll', () => {
      const lebar = p.firstElementChild ? p.firstElementChild.offsetWidth + 12 : 1, n = Math.round(p.scrollLeft / lebar);
      [...$('titik').children].forEach((d, i) => d.classList.toggle('on', i === n));
    }, { passive: true });
  }
  function buka(k, s, kol) {
    if (k === '__menu') return lembarMenu();
    if (k === '__notif') return lembarNotif();
    tutup();
    S.layar = k; S.cari = ''; S.pil = new Set(s && S.gaya !== 'i' ? [s] : []);
    gambar();
    if (kol) requestAnimationFrame(() => { const p = $('papan'), c = p && p.querySelector(`[data-kolom="${kol}"]`); if (c) p.scrollLeft = c.offsetLeft - p.firstElementChild.offsetLeft; });
  }

  /* ───── Lembar ───── */
  const lembar = $('lembar'), tirai = $('tirai');
  let jedaTutup = 0;
  function bukaLembar(html) {
    lembar.innerHTML = '<div class="pegangan"></div>' + html; lembar.scrollTop = 0;
    clearTimeout(jedaTutup);
    lembar.hidden = false; tirai.hidden = false;
    void lembar.offsetHeight;
    lembar.classList.add('buka'); tirai.classList.add('buka');
  }
  function tutup() {
    lembar.classList.remove('buka'); tirai.classList.remove('buka');
    clearTimeout(jedaTutup);
    jedaTutup = setTimeout(() => { lembar.hidden = true; tirai.hidden = true; }, 250);
  }
  function lembarMenu() {
    bukaLembar(`<h3>Semua menu</h3>${GRUP.map(([g, ks]) => `<div class="grupnama">${g}</div><div class="grid-menu">${ks.map(tileBtn).join('')}</div>`).join('')}`);
  }
  function lembarNotif() {
    const n = [['tiket', 'pending', 'Tiket baru ditugaskan ke kamu', 'OCS Indonesia · 5 menit lalu'], ['review', 'tunggu', 'Form Review menunggu persetujuan', 'BAST Sinar Mas Land · 1 jam lalu'],
      ['jadwal', 'minggu', 'Jadwal Rabu: Survey Bank Mandiri', 'Pengingat · 2 jam lalu'], ['unit', 'telat', 'Unit belum kembali 122 hari', 'HDMI 4 pcs · kemarin']];
    bukaLembar(`<h3>Notifikasi</h3><div class="tumpuk" style="margin-top:12px">${n.map(([k, s, t, d]) => `<button type="button" class="kartu" data-buka="${k}" style="display:flex;gap:12px;align-items:center;width:100%"><span class="tile w-${stW(k, s)}">${ik(MOD[k].ikon)}</span><span style="min-width:0"><b style="font-size:13.5px;display:block">${t}</b><span class="sub">${d}</span></span></button>`).join('')}</div>`);
  }
  function lembarDetail(k, i) {
    const x = semua(k)[i];
    bukaLembar(`<div style="display:flex;gap:12px;align-items:flex-start"><span class="tile w-${stW(k, x.s)}">${ik(MOD[k].ikon)}</span><div style="flex:1;min-width:0"><h3>${x.t}</h3><div class="sub" style="margin-top:3px">${x.d}</div></div></div>
      <div style="margin:14px 0 6px">${pil(k, x.s)}</div>${x.p != null ? `<div style="display:flex;align-items:center;gap:10px;margin:10px 0">${bilah(x.p, stW(k, x.s)).replace('class="bilah', 'style="flex:1" class="bilah')}<b class="num">${x.p}%</b></div>` : ''}
      <div style="margin-top:8px">${x.meta.map(t => { const m = pecahM(t); return `<div class="detail-baris"><span>${m.lbl}</span><span>${m.v}</span></div>`; }).join('')}${x.w ? `<div class="detail-baris"><span>${k === 'project' ? 'Nilai project' : k === 'progress' ? 'Progres' : 'Waktu'}</span><span>${x.w}</span></div>` : ''}<div class="detail-baris"><span>Menu</span><span>${MOD[k].nama}</span></div></div>
      <button type="button" class="tombol" data-tutup="1" style="margin-top:16px">Tutup</button>`);
  }

  /* ───── Event ───── */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, .tirai');
    if (!t) return;
    if (t.id === 'tirai' || t.dataset.tutup) return tutup();
    if (t.id === 'tema') return tukarTema();
    if (t.dataset.gaya) { S.gaya = t.dataset.gaya; S.pil.clear(); S.cari = ''; simpan('coba-hp-gaya', S.gaya); tutup(); return gambar(); }
    if (t.dataset.item) { const [k, i] = t.dataset.item.split(':'); return lembarDetail(k, +i); }
    if (t.dataset.buka) return buka(t.dataset.buka, t.dataset.s, t.dataset.kol);
    if (t.dataset.f) {
      const s = t.dataset.f;
      if (s === '__semua') S.pil.clear();
      else if (t.dataset.tunggal) S.pil = new Set(S.pil.has(s) && S.pil.size === 1 ? [] : [s]);
      else if (S.pil.has(s)) S.pil.delete(s); else S.pil.add(s);
      return gambarDaftar(true);
    }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'cari') { S.cari = e.target.value; gambarDaftar(false); } });
  $('scr').addEventListener('scroll', () => { const a = $('f-atas'); if (a) a.classList.toggle('ciut', $('scr').scrollTop > 40); }, { passive: true });

  function simpan(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function baca(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function pasangTema(gelap) {
    if (gelap) document.documentElement.dataset.theme = 'dark'; else document.documentElement.removeAttribute('data-theme');
    $('tema').innerHTML = ik(gelap ? 'i-matahari' : 'i-bulan', 'width:17px;height:17px');
  }
  function tukarTema() { const g = document.documentElement.dataset.theme !== 'dark'; pasangTema(g); simpan('coba-hp-tema', g ? 'gelap' : 'terang'); }

  pasangTema(baca('coba-hp-tema') === 'gelap');
  const g0 = baca('coba-hp-gaya'); if (g0 && GAYA[g0]) S.gaya = g0;
  gambar();
})();
</script>
</body>
</html>
