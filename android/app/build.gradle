plugins { id 'com.android.application' }

// Firebase (notifikasi) aktif bila android/app/google-services.json ada.
// Tanpa berkas itu aplikasi tetap bisa dibangun & dipakai, hanya tanpa push.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def versi = new Properties()
file('../version.properties').withInputStream { versi.load(it) }

def HOST = 'work-management-ptsivp.vercel.app'

android {
    namespace 'id.ptsivp.workmanagement'
    compileSdk 34

    defaultConfig {
        applicationId 'id.ptsivp.workmanagement'
        minSdk 26
        targetSdk 34
        versionCode versi.getProperty('versionCode').toInteger()
        versionName versi.getProperty('versionName')
        buildConfigField 'String', 'APP_HOST', "\"${HOST}\""
    }
    buildFeatures { buildConfig true }

    // Kunci rilis dari secret CI (ANDROID_KEYSTORE_BASE64 / _PASSWORD) - tidak
    // pernah disimpan di repo. Tanpa kunci, hanya build debug yang bisa dibuat.
    def jalurKunci = System.getenv('KEYSTORE_PATH')
    signingConfigs {
        if (jalurKunci) {
            rilis {
                storeFile file(jalurKunci)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'ptsivp'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (jalurKunci) signingConfig signingConfigs.rilis
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
