name: Android APK

# APK native (WebView + FCM) yang membuka web produksi. Web baru TIDAK butuh
# APK baru; rilis APK hanya saat android/ berubah (naikkan version.properties).
#
# Alur rilis (bisa dijalankan dari sesi cloud yang tidak punya Android SDK):
#   1. naikkan versionCode & versionName di android/version.properties
#   2. merge ke main
#   3. job ini membangun APK rilis bertanda tangan lalu MENERBITKANNYA sendiri
#      ke Admin Panel -> Aplikasi Android (scripts/terbitkan-apk.mjs); pengguna
#      aplikasi langsung mendapat ajakan update.
# Push tanpa kenaikan versionCode tidak menerbitkan apa pun.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/terbitkan-apk.mjs']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/terbitkan-apk.mjs']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan kunci rilis
        id: kunci
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rilis.jks"
            echo "ada=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 belum diisi - hanya build debug, APK tidak dipublikasikan."
            echo "ada=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK rilis
        if: steps.kunci.outputs.ada == '1'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/rilis.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Build APK debug (tanpa kunci)
        if: steps.kunci.outputs.ada != '1'
        run: gradle -p android assembleDebug --no-daemon

      # Build manual tanpa kunci: salinan APK debug ke TAG apk-uji supaya bisa
      # diambil lewat git. Tag, bukan branch - Vercel mem-build setiap branch
      # (gagal & membuang jatah build), tapi tidak mem-build tag.
      - name: Salin APK uji ke tag apk-uji
        if: steps.kunci.outputs.ada != '1' && github.event_name == 'workflow_dispatch'
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/work-management-debug.apk"
          cd "$RUNNER_TEMP" && rm -rf uji && mkdir uji && cd uji
          git init -q -b uji
          cp ../work-management-debug.apk .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "APK uji (debug) dari ${GITHUB_SHA::7}"
          git tag -f apk-uji
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/tags/apk-uji

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/**/*.apk

      # Terbitkan ke Admin Panel -> Aplikasi Android, hanya dari main dan hanya
      # APK rilis (bertanda tangan kunci tetap - APK debug ditandatangani kunci
      # acak per build, jadi tidak bisa dipasang menimpa versi sebelumnya).
      # Unggah manual lewat Admin Panel tetap bisa dipakai kapan saja.
      - name: Terbitkan ke Admin Panel
        if: steps.kunci.outputs.ada == '1' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PESAN: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Secret SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum diisi - APK tidak diterbitkan otomatis. Unggah artefak 'apk' lewat Admin Panel."
            exit 0
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          # Commit merge PR berbaris pertama "Merge pull request #N from ..." -
          # tidak berguna sebagai catatan rilis; judul PR ada di badan commit.
          CATATAN=$(printf '%s\n' "$PESAN" | grep -v '^Merge pull request' | grep -v '^Co-Authored-By\|^Claude-Session' | sed '/^[[:space:]]*$/d' | head -5)
          node scripts/terbitkan-apk.mjs "$APK" "$CATATAN"
