name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Nilai palsu: build & uji tidak menyentuh jaringan Supabase sungguhan.
      NEXT_PUBLIC_SUPABASE_URL: https://x.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
      NEXT_PUBLIC_SUPABASE_SERVICES_URL: https://y.supabase.co
      NEXT_PUBLIC_SUPABASE_SERVICES_ANON_KEY: dummy
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Uji
        # Semua uji/*.ts + *.mjs (scripts/uji-semua.mjs) - daftar manual dulu tertinggal tiap ada uji baru.
        run: npm test
      - name: Build
        run: npm run build
